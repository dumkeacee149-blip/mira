name: Release Desktop macOS Package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag to receive the macOS package
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-macos-package:
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop app
        run: pnpm -F @proj-mira/stage-tamagotchi run build

      - name: Package macOS dmg
        run: >-
          pnpm -F @proj-mira/stage-tamagotchi exec electron-builder
          --mac dmg
          --arm64
          --publish never
          --config.mac.identity=null
          --config.mac.notarize=false
          --config.mac.hardenedRuntime=false

      - name: Upload macOS release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: |
            apps/stage-tamagotchi/dist/Mira-*-darwin-arm64.dmg
            apps/stage-tamagotchi/dist/Mira-*-darwin-arm64.dmg.blockmap
            apps/stage-tamagotchi/dist/latest-mac.yml
          fail_on_unmatched_files: false

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-desktop-package
          path: |
            apps/stage-tamagotchi/dist/Mira-*-darwin-arm64.dmg
            apps/stage-tamagotchi/dist/Mira-*-darwin-arm64.dmg.blockmap
            apps/stage-tamagotchi/dist/latest-mac.yml
          if-no-files-found: warn
