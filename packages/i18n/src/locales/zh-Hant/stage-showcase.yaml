    description: 首頁負責建立角色與產品印象，/stage 負責真實互動，設定與登入保持獨立。
    continue: 繼續前往
  capabilities:
    presence:
      title: 可被記住的主角色
      body: 先讓使用者記住 MIRA 是誰，再去理解系統能做什麼。
    orchestration:
      title: 被角色包裹的智慧能力
      body: 把模型、工具與記憶放進角色語境裡，技術能力才不會顯得生硬。
    continuity:
      title: 從首頁到會話的連續感
      body: 讓首頁、舞台、設定與登入共享同一套情緒與角色氣質，產品感才完整。
  narrative:
    arrive:
      title: 先讓她出現
      body: 用鮮明的 Live2D 輪廓、克制的配色與明確的角色定位，取代泛用 AI 助手的空泛開場。
    listen:
      title: 再講她如何說話與記住你
      body: 透過縱向滾動敘事，把語音、上下文與關係連續性講清楚，再把使用者帶進舞台。
    anchor:
      title: 始終保留真實舞台
      body: 讓真實陪伴角色一直陪在敘事旁邊，產品是否「活著」不再依賴假模型暗示。
    handoff:
      title: 最後交給真實使用場景
      body: 用清晰入口把使用者送進即時舞台、系統設定或登入流程，而不是把所有工作都擠在同一個頁面裡。
  routeCards:
    stage:
      title: /stage
      body: 直接進入即時陪伴舞台，開始對話、語音與角色互動。
      action: 進入即時舞台
    settings:
      title: /settings
      body: 配置模型、背景、語音、工具與系統行為，把 MIRA 調成你想要的樣子。
      action: 調整系統體驗
    auth:
      title: /auth/login
      body: 把帳號接入放在次級入口，讓首頁始終專注展示產品本身。
      action: 繼續登入
  cta:
    eyebrow: 準備好見到 MIRA
    title: 打開角色，調校系統，讓白藤成為 MIRA 下一版更容易被記住的主角。
    description: 從第一眼到第一次真實對話，新的首頁正在圍繞更清晰的 Live2D 形象建立 MIRA 的產品記憶。
    primary: 進入即時舞台
    secondary: 前往系統設定
