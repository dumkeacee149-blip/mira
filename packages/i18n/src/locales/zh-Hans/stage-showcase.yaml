  routes:
    eyebrow: 产品入口分层
    title: 让展示、交互与配置各归其位。
    description: 首页负责建立角色与产品印象，/stage 负责真实交互，设置与登录保持独立。
    continue: 继续前往
  capabilities:
    presence:
      title: 可被记住的主角色
      body: 先让用户记住 MIRA 是谁，再去理解系统能做什么。
    orchestration:
      title: 被角色包裹的智能能力
      body: 把模型、工具与记忆放进角色语境里，技术能力才不会显得生硬。
    continuity:
      title: 从首页到会话的连贯感
      body: 让首页、舞台、设置和登录共享同一套情绪与角色气质，产品感才完整。
  narrative:
    arrive:
      title: 先让她出现
      body: 用鲜明的 Live2D 轮廓、克制的配色和明确的角色定位，替代泛用 AI 助手的空泛开场。
    listen:
      title: 再讲她如何说话和记住你
      body: 通过纵向滚动叙事，把语音、上下文与关系连续性讲清楚，再把用户带进舞台。
    anchor:
      title: 始终保留真实舞台
      body: 让真实陪伴角色一直陪在叙事旁边，产品是否“活着”不再依赖假模型暗示。
    handoff:
      title: 最后交给真实使用场景
      body: 用清晰入口把用户送进实时舞台、系统设置或登录流程，而不是把所有工作都挤在一个页面里。
  routeCards:
    stage:
      title: /stage
      body: 直接进入实时陪伴舞台，开始对话、语音和角色互动。
      action: 进入实时舞台
    settings:
      title: /settings
      body: 配置模型、背景、语音、工具与系统行为，把 MIRA 调成你想要的样子。
      action: 调整系统体验
    auth:
      title: /auth/login
      body: 把账号接入放在次级入口，让首页始终专注展示产品本身。
      action: 继续登录
  cta:
    eyebrow: 准备好见到 MIRA
    title: 打开角色，调校系统，让白藤成为 MIRA 下一版更容易被记住的主角。
    description: 从第一眼到第一次真实对话，新的首页正在围绕更清晰的 Live2D 形象建立 MIRA 的产品记忆。
    primary: 进入实时舞台
    secondary: 前往系统设置
