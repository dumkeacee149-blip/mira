    eyebrow: 实时舞台验证
    title: 实时舞台应该像同一个角色从首页里走出，真正开始与你说话。
    action: 打开舞台
    caption: 保留真实 WidgetStage，让新的主角色不只是被展示，而是真正在舞台里与你互动。
    badges:
      voice: 语音在场
      memory: 记忆延续
